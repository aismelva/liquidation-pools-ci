name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  analyze-liquidations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar análisis de pools de liquidación (datos reales, sin API key)
        run: python src/liquidation_analysis.py
