name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nota: los commits hechos con GITHUB_TOKEN no disparan nuevos workflows
# (regla de GitHub), así que el commit de resultados no genera bucles.
permissions:
  contents: write

jobs:
  fase1-clusteres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fase 1 — análisis de clústeres de liquidación (datos reales, sin API key)
        run: python src/liquidation_analysis.py

  fase2-modelo-pools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fase 2 — modelo de pools de liquidación (cohortes de OI, datos reales)
        env:
          LIQ_DAYS: "3"
        run: python src/pool_model.py

  fase2b-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fase 2b — backtesting v3 (lookahead 48h, 14 días de datos) contra liquidaciones reales
        env:
          LIQ_DAYS: "14"
          LIQ_LOOKAHEAD_H: "48"
        run: python src/backtest.py
      - name: Publicar resultados al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/last_backtest.md
          git diff --cached --quiet || git commit -m "docs: resultados del último backtest [skip ci]"
          git push
